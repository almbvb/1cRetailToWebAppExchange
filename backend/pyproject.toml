[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-backend"
version = "0.1.0"
description = "Backend сайта доставки продуктов: приём данных из 1С:Розница и API для фронтенда"
requires-python = ">=3.14"
# Версии закреплены точно (==), проверены установкой на Python 3.14.
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.1.9",
    "psycopg[binary]==3.3.9",
    "alembic==1.20.1",
    "httpx==0.28.1",
    "pillow==13.0.0",
    "sqladmin[full]==0.32.0",
    "greenlet==3.5.6",
    "python-multipart==0.0.34",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# Папка alembic/ с миграциями не должна приниматься за собственный пакет.
known-third-party = ["alembic"]
known-first-party = ["app"]
